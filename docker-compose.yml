# Quick start: docker compose up -d, then open http://localhost:8080 and sign in as admin.
# Change every password below before exposing this to the internet.
services:
  polrnet:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__PolrNet: "Server=mysql;Database=polrnet;User ID=polrnet;Password=polrnet-password"
      PolrNet__BaseUrl: "http://localhost:8080"
      PolrNet__AdvancedAnalytics: "true"
      PolrNet__Admin__Username: "admin"
      PolrNet__Admin__Email: "admin@example.com"
      PolrNet__Admin__Password: "change-me-please"
      # Uncomment when running behind a reverse proxy (nginx, Traefik, Caddy...), so client IPs and HTTPS are detected.
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - keys:/keys
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: polrnet
      MYSQL_USER: polrnet
      MYSQL_PASSWORD: polrnet-password
      MYSQL_ROOT_PASSWORD: root-password
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppolr-password", "-upolrnet"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql:
  keys:
